# Render Blueprint: deploys the Python astrology API from astrology/Dockerfile.
# The Next.js site stays on Vercel and reaches this service through ASTROLOGY_API_URL.
services:
  - type: web
    name: myloginn-astrology
    runtime: docker
    dockerfilePath: ./astrology/Dockerfile
    dockerContext: ./astrology
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Generated once by Render. Copy the same value into Vercel as ASTROLOGY_API_SECRET.
      - key: ASTROLOGY_API_SECRET
        generateValue: true
